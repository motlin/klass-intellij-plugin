on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    forbid-merge-commits:
        runs-on: ubuntu-latest
        steps:
            - uses: motlin/forbid-merge-commits-action@e79f9ed1c54b0bfb9e8a4ecaa8acfabfd01c1953 # main

    automerge-dependabot:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Enable auto-merge for Dependabot PR
              run: gh pr merge --rebase --auto "${{ github.event.pull_request.number }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    biome-fix:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "github-actions@github.com"

            - name: Run Biome Format
              run: |
                  npx @biomejs/biome format --write

                  if [[ -n $(git status --porcelain) ]]; then
                    FIX_BRANCH="fix-${{ github.event.pull_request.number }}-biome"
                    git switch --create $FIX_BRANCH

                    git add --all
                    git commit --message "Apply Biome formatting."
                    git push --force origin $FIX_BRANCH

                    echo "Biome formatting fixes have been pushed to the $FIX_BRANCH branch."
                    exit 1
                  else
                    echo "No changes needed by Biome"
                  fi

    pre-commit-fix:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.x"

            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "github-actions@github.com"

            - name: Run pre-commit
              run: |
                  pre-commit run --all-files || true

                  if [[ -n $(git status --porcelain) ]]; then
                    FIX_BRANCH="fix-${{ github.event.pull_request.number }}-pre-commit"
                    git switch --create $FIX_BRANCH

                    git add --all
                    git commit --message "Apply pre-commit fixes."
                    git push --force origin $FIX_BRANCH

                    echo "pre-commit fixes have been pushed to the $FIX_BRANCH branch."
                    exit 1
                  else
                    echo "No changes needed by pre-commit"
                  fi

    prettier-fix:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "github-actions@github.com"

            - name: Run Prettier Format
              run: |
                  npx prettier --write . '!.github/workflows/**'

                  if [[ -n $(git status --porcelain) ]]; then
                    FIX_BRANCH="fix-${{ github.event.pull_request.number }}-prettier"
                    git switch --create $FIX_BRANCH

                    git add --all
                    git commit --message "Apply Prettier formatting."
                    git push --force origin $FIX_BRANCH

                    echo "Prettier formatting fixes have been pushed to the $FIX_BRANCH branch."
                    exit 1
                  else
                    echo "No changes needed by Prettier"
                  fi

    rewrite-fix:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
              with:
                  distribution: "temurin"
                  java-version: "21"

            - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "github-actions@github.com"

            - name: Run OpenRewrite and commit changes
              run: |
                  ./gradlew rewriteRun

                  if [[ -n $(git status --porcelain) ]]; then
                    FIX_BRANCH="fix-${{ github.event.pull_request.number }}-rewrite"
                    git switch --create $FIX_BRANCH

                    git add --all
                    git commit --message "Apply OpenRewrite changes."
                    git push --force origin $FIX_BRANCH

                    echo "OpenRewrite fixes have been pushed to the $FIX_BRANCH branch."
                    exit 1
                  else
                    echo "No changes needed by OpenRewrite"
                  fi

    spotless-java-fix:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: gradle-spotless-java-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  restore-keys: |
                      gradle-spotless-
                      gradle-

            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "github-actions@github.com"

            - name: Run Spotless Apply for Java
              run: |
                  ./gradlew spotlessApply

                  if [[ -n $(git status --porcelain) ]]; then
                    FIX_BRANCH="fix-${{ github.event.pull_request.number }}-spotless-java"
                    git switch --create $FIX_BRANCH

                    git add --all
                    git commit --message "Apply Spotless Java formatting."
                    git push --force origin $FIX_BRANCH

                    echo "Spotless Java fixes have been pushed to the $FIX_BRANCH branch."
                    exit 1
                  else
                    echo "No changes needed by Spotless"
                  fi

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

            - run: ./gradlew buildPlugin

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: plugin
                  path: build/distributions/*.zip

    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

            - name: Run Plugin Verification tasks
              run: ./gradlew verifyPlugin

            - name: Collect Plugin Verifier Result
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pluginVerifier-result
                  path: build/reports/pluginVerifier
